<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unordered List</title>
</head>
<body>
    <h1>Unordered List</h1>
    <ul style="list-style-type: square;"> 
        <li>CSIT</li>
            <ul style="list-style-type: disc;">
                <li>Web Tech</li>
                <li>C</li>
                    <ul>
                        <li>Functions</li>
                        <li>Loops</li>
                        <li>Pointer</li>
                    </ul>
                <li>C++</li>
                <li>SAD</li>
            </ul>
        <li>BITM</li>
        <li>BCA</li>
    </ul>

    <!--Square = value (list-style type) attribute-->
</body>
</html>
