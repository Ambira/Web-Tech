<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unordered List</title>
</head>
<body>
    <h1>Unordered List</h1>
    <ol type="I"> 
        <li>CSIT</li>
            <ol>
                <li>Web Tech</li>
                <li>C</li>
                    <ol type="a">
                        <li>Functions</li>
                        <li>Loops</li>
                        <li>Pointer</li>
                    </ol>
                <li>C++</li>
                <li>SAD</li>
            </ol>
        <li>BITM</li>
        <li>BCA</li>
    </ol>

    <!--here type attribute is used to specify the numbering style like a A I i and so on -->
    <!--also type ="I" start = 5 means it starts from that number <ol reversed> is basically used to reverse the order of the list items -->
</body>
</html>
